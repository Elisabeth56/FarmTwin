# Downloads every pinned model file and checks its SHA-256 and size, whenever a pin changes.
name: model pin
on:
  pull_request:
    paths: [apps/api/app/ai/setup.py]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: download and compare every pinned file
        run: |
          python3 - <<'PY'
          import hashlib, re, subprocess, sys
          src = open("apps/api/app/ai/setup.py").read()
          pins = re.findall(r'url="([^"]+)",\s*sha256="([0-9a-f]{64})",\s*size=([0-9_]+)', src)
          assert pins, "no pins found"
          bad = 0
          for url, want, size in pins:
              subprocess.run(["curl", "-sSL", "--fail", "-o", "pinned.bin", url], check=True)
              data = open("pinned.bin", "rb").read()
              got = hashlib.sha256(data).hexdigest()
              ok = got == want and len(data) == int(size.replace("_", ""))
              print(("ok  " if ok else "BAD ") + url, got, len(data))
              bad += not ok
          sys.exit(bad)
          PY
