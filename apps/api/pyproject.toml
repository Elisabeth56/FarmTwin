[project]
name = "farmtwin-api"
version = "0.2.0"
description = "FarmTwin backend: farm records, crop engines, retrieval and the local LLM bridge."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.35",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "platformdirs==4.3.6",
    "python-multipart==0.0.12",
    "httpx==0.27.2",
    "sqlite-vec==0.1.6",
    "pyyaml==6.0.2",
    "numpy==1.26.4",
    "alembic==1.14.0",
    "fastembed==0.9.1",
]

[project.optional-dependencies]
# PyTorch Whisper for v1 voice input, replaced by whisper.cpp in #16 (ADR-017). CI runs without it.
ml = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "soundfile==0.12.1",
]

[dependency-groups]
dev = [
    "ruff==0.8.1",
    "pyright==1.1.389",
    "pytest==8.3.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI declares dependencies as default arguments
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# scripts put the api package on sys.path before importing it
"scripts/*" = ["E402"]

[tool.pyright]
include = ["app"]
# PyTorch-era voice client; removed by ADR-017
exclude = ["app/stt/whisper_client.py"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
